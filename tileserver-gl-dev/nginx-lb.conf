# Round-robins across the scaled `app` replicas. Using the hostname in a
# variable forces per-request resolution via Docker's embedded DNS (127.0.0.11),
# which returns all replica IPs — so open-source nginx distributes each request
# instead of pinning to one IP at startup (as a static upstream would).
resolver 127.0.0.11 valid=1s ipv6=off;

# No query string or Referer, so ?key= API keys and tokens never reach the log.
log_format tileserver_noquery '$remote_addr [$time_local] '
                              '"$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent $request_time '
                              '"$http_user_agent"';

server {
  listen 80;

  access_log /var/log/nginx/access.log tileserver_noquery;

  location / {
    set $backend app;
    proxy_pass http://$backend:8080$request_uri;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
