# Horizontal-scaling demo: N stateless light-s3 replicas behind an nginx load
# balancer, all reading from the EXISTING MinIO started by compose.s3.yml (joined
# as an external network). Separate project/service names so it never collides
# with the single-container stack.
#
#   docker compose -f compose.s3.yml up -d                     # MinIO + tiles must be running first
#   docker compose -f compose.scale.yml up -d --scale app=4
#   # k6 -> the LB (in-network):  BASE_URL=http://lb
#   docker compose -f compose.scale.yml down
name: tileserver-scale

services:
  # Stateless replicas — no published ports, so they scale freely. Reached only
  # through the LB on the shared network. Same image/env as the single stack.
  app:
    # Defaults to the latest release (set by npm run release); set TILESERVER_VERSION to run another.
    image: stsdockerhub/tileserver-gl:${TILESERVER_VERSION:-1.0.0}-light-s3
    environment:
      # Same variables and defaults as compose.s3.yml, so an override there applies here too.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      PMTILES_URL: s3+http://minio:9000/tiles/planet.pmtiles
      TILESERVER_GL_API_KEYS: ${TILESERVER_GL_API_KEYS:-devkey123}
      TILESERVER_GL_TOKEN_SECRET: ${TILESERVER_GL_TOKEN_SECRET:-dev-hmac-secret}
    command: ["--config", "/data/config.json", "--silent"]
    networks: [tsnet]

  lb:
    image: nginx:1.27-alpine
    depends_on: [app]
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8083:80" # optional host access at http://localhost:8083, loopback only
    networks: [tsnet]

networks:
  tsnet:
    name: tileserver-s3_default
    external: true
