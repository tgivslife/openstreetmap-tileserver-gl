# Builds the light and light-s3 images for linux/amd64 and linux/arm64, and publishes them to Docker Hub on a version tag.
#
#   npm run release -- 1.1.0 && git push github main v1.1.0     # publishes <repo>:1.1.0-light and <repo>:1.1.0-light-s3
#
# The tag must be "v" + tileserver-gl/package.json's version, on the single release commit `npm run release` makes
# (scripts/release.js --check); otherwise nothing is built. Pushes to main and pull requests run the same builds without
# publishing.
#
# Needs, in the repository settings:
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with read/write access)
#   variable  DOCKERHUB_REPOSITORY (optional, default stsdockerhub/tileserver-gl)
#
# Each architecture builds on its own native runner: light first, pushed by digest (no tag), then light-s3 FROM that
# digest, so the pair always comes from one commit. On a version tag the digests go to Docker Hub, and the manifest job
# combines each image's two digests under its plain tag, which pulls the right architecture automatically; no
# per-architecture tags are created. Elsewhere the same chain pushes to a throwaway registry on the runner instead.

name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'stsdockerhub/tileserver-gl' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      revision: ${{ steps.read.outputs.revision }}
      created: ${{ steps.read.outputs.created }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the release check compares the tagged commit with its parent
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the tag is on a release commit
        if: github.ref_type == 'tag'
        run: node tileserver-gl/scripts/release.js --check
      - name: Read version
        id: read
        run: |
          version=$(node -p "require('./tileserver-gl/package.json').version")
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "revision=$(git rev-parse --short HEAD)"
            echo "created=$(git log -1 --format=%cI)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, publish=$publish"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A throwaway registry for builds that do not publish: light is pushed there by digest so light-s3 can build on it.
    services:
      registry:
        image: registry:2
        ports: ['5000:5000']
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      # Where the untagged per-architecture images go: Docker Hub when publishing, the runner's registry otherwise.
      TARGET: >-
        ${{ needs.version.outputs.publish == 'true'
            && (vars.DOCKERHUB_REPOSITORY || 'stsdockerhub/tileserver-gl')
            || 'localhost:5000/tileserver-gl' }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Host networking lets the builder reach the runner's registry on localhost:5000, which speaks plain HTTP.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Build light
        id: light
        uses: docker/build-push-action@v7
        with:
          context: tileserver-gl
          file: tileserver-gl/Dockerfile_light
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ needs.version.outputs.revision }}
            CREATED=${{ needs.version.outputs.created }}
          outputs: type=image,name=${{ env.TARGET }},push-by-digest=true,name-canonical=true,push=true
      - name: Build light-s3
        id: s3
        uses: docker/build-push-action@v7
        with:
          context: tileserver-gl-data
          file: tileserver-gl/Dockerfile_light_s3
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE=${{ env.TARGET }}@${{ steps.light.outputs.digest }}
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ needs.version.outputs.revision }}
            CREATED=${{ needs.version.outputs.created }}
          outputs: type=image,name=${{ env.TARGET }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke test
        run: |
          reported=$(docker run --rm "$TARGET@${{ steps.s3.outputs.digest }}" --version | tail -1)
          echo "light-s3 reports $reported"
          [[ "$reported" == "$VERSION" ]]
      - name: Record digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.light.outputs.digest }}" > "digests/light-${{ matrix.arch }}"
          echo "${{ steps.s3.outputs.digest }}" > "digests/light-s3-${{ matrix.arch }}"
      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  manifest:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Combine architectures under the plain tags
        run: |
          for image in light light-s3; do
            docker buildx imagetools create -t "$REPOSITORY:$VERSION-$image" \
              "$REPOSITORY@$(cat "digests/$image-amd64")" "$REPOSITORY@$(cat "digests/$image-arm64")"
            docker buildx imagetools inspect "$REPOSITORY:$VERSION-$image"
          done
