# Builds the light and light-s3 images for linux/amd64 and linux/arm64, and publishes them to Docker Hub on a version tag.
#
#   git tag v1.0.0 && git push github v1.0.0     # publishes <repo>:1.0.0-light and <repo>:1.0.0-light-s3
#
# The tag must be "v" + tileserver-gl/package.json's version, and the version check (scripts/version-sync.js --check)
# must pass; otherwise nothing is built. Pushes to main and pull requests run the same builds without publishing.
#
# Needs, in the repository settings:
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with read/write access)
#   variable  DOCKERHUB_REPOSITORY (optional, default stsdockerhub/tileserver-gl)
#
# Each architecture builds on its own native runner: light first, then light-s3 FROM that local light image, so the
# pair always comes from one commit. Publishing pushes per-architecture tags (<version>-light-amd64, ...), then the
# manifest job combines them under the plain tags, which pull the right architecture automatically.

name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'stsdockerhub/tileserver-gl' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      upstream: ${{ steps.read.outputs.upstream }}
      revision: ${{ steps.read.outputs.revision }}
      created: ${{ steps.read.outputs.created }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check version consistency
        run: node tileserver-gl/scripts/version-sync.js --check
      - name: Read version
        id: read
        run: |
          version=$(node -p "require('./tileserver-gl/package.json').version")
          upstream=$(node -p "require('./tileserver-gl/package.json').upstreamVersion")
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "upstream=$upstream"
            echo "revision=$(git rev-parse --short HEAD)"
            echo "created=$(git log -1 --format=%cI)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version (upstream $upstream), publish=$publish"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The docker driver builds into the runner's own image store, so the light-s3 build can use the light image just
      # built as its base without a registry round trip.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build light
        uses: docker/build-push-action@v6
        with:
          context: tileserver-gl
          file: tileserver-gl/Dockerfile_light
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            UPSTREAM_VERSION=${{ needs.version.outputs.upstream }}
            REVISION=${{ needs.version.outputs.revision }}
            CREATED=${{ needs.version.outputs.created }}
          tags: ${{ env.REPOSITORY }}:${{ env.VERSION }}-light-${{ matrix.arch }}
          push: ${{ env.PUBLISH == 'true' }}
      - name: Build light-s3
        uses: docker/build-push-action@v6
        with:
          context: tileserver-gl-data
          file: tileserver-gl/Dockerfile_light_s3
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE=${{ env.REPOSITORY }}:${{ env.VERSION }}-light-${{ matrix.arch }}
            VERSION=${{ needs.version.outputs.version }}
            UPSTREAM_VERSION=${{ needs.version.outputs.upstream }}
            REVISION=${{ needs.version.outputs.revision }}
            CREATED=${{ needs.version.outputs.created }}
          tags: ${{ env.REPOSITORY }}:${{ env.VERSION }}-light-s3-${{ matrix.arch }}
          push: ${{ env.PUBLISH == 'true' }}
      - name: Smoke test
        run: |
          reported=$(docker run --rm "$REPOSITORY:$VERSION-light-s3-${{ matrix.arch }}" --version | tail -1)
          echo "light-s3 reports $reported"
          [[ "$reported" == "$VERSION" ]]

  manifest:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Combine architectures under the plain tags
        run: |
          for image in light light-s3; do
            docker buildx imagetools create -t "$REPOSITORY:$VERSION-$image" \
              "$REPOSITORY:$VERSION-$image-amd64" "$REPOSITORY:$VERSION-$image-arm64"
            docker buildx imagetools inspect "$REPOSITORY:$VERSION-$image"
          done
